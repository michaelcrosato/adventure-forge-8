[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adventure-forge"
version = "0.1.0"
description = "Deterministic single-world action adventure. The model is never the physics."
requires-python = ">=3.11"
readme = "README.md"

[project.scripts]
adventure-forge = "adventure_forge.cli:main"

[tool.vercel]
entrypoint = "adventure_forge.web:app"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
